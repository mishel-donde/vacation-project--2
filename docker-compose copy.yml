version: "3.8"

services:
  database:
    image: mysql:8.0
    container_name: vacation-database
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=1
      - MYSQL_DATABASE=vacations_store
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 5

  localstack:
    image: localstack/localstack
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vacation-backend
    ports:
      - "3003:3003"
    depends_on:
      database:
        condition: service_healthy
    environment:
      - NODE_ENV=compose
      - DB_HOST=database
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=
      - DB_NAME=vacations_store
      - AWS_BUCKET=il.co.johnbryce.mishel
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - IO_URL=http://io:3004

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vacation-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_REST_SERVER_URL=http://backend:3003
      - VITE_IO_SERVER_URL=http://io:3004
      - VITE_AWS_SERVER_URL=http://localstack:4566/il.co.johnbryce.mishel

  io:
    build:
      context: .
      dockerfile: Dockerfile.io
    container_name: vacation-io
    ports:
      - "3004:3004"

volumes:
  mysql-data:
